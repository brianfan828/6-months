name: Set June side otter
on:
  push:
    paths:
      - '.github/workflows/set-june-otter.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put exact supplied otter beside 3 Months Together
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          marker='<small>June 2026</small>'
          pos=s.index(marker)
          start=s.rfind('<section class="month">',0,pos)
          end=s.index('</section>',pos)+len('</section>')
          block=s[start:end]
          block2=re.sub(r'(<aside class="sidepet"><img src=")[^"]+(" alt=""></aside>)',r'\1f0d7fb7143a0.png\2',block,count=1)
          if block2==block and 'f0d7fb7143a0.png' not in block:
              raise SystemExit('June sidepet not found')
          p.write_text(s[:start]+block2+s[end:])
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use exact uploaded otter beside June card"
          git push
